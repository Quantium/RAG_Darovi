<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asistente Virtual</title>
    <link rel="stylesheet" href="/styles.css?v=2" />
  </head>
  <body>

    <!-- LOGIN SECTION -->
    <main id="login-section" class="page-bg">
      <div class="login-card">
        <div class="login-logo">
          <!-- Bot icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
        </div>
        <h1 class="login-title">Asistente Virtual</h1>
        <p class="login-subtitle">Inicia sesión para continuar</p>
        <form id="login-form" class="login-form">
          <input
            id="login-username"
            type="text"
            placeholder="Usuario"
            autocomplete="username"
            required
          />
          <input
            id="login-password"
            type="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
          />
          <button type="submit">Entrar</button>
          <p id="login-error" class="login-error" hidden></p>
        </form>
      </div>
    </main>

    <!-- CHAT SECTION (hidden until authenticated) -->
    <main id="chat-section" class="page-bg" hidden>
      <div class="chat-window">

        <!-- Header -->
        <div class="chat-header">
          <div class="chat-header-left">
            <div class="header-avatar">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
            </div>
            <div>
              <h1 class="header-title">Asistente Virtual</h1>
              <p class="header-status">En línea</p>
            </div>
          </div>
          <button id="logout-btn" type="button" class="logout-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Salir</span>
          </button>
        </div>

        <!-- Messages -->
        <div id="messages" class="messages"></div>

        <!-- Sources -->
        <div id="sources"></div>

        <!-- Rating bar goes here (inserted by JS before the form) -->

        <!-- Input -->
        <div class="chat-input-area">
          <form id="chat-form" class="chat-form">
            <input id="query-input" placeholder="Escribe tu mensaje..." autocomplete="off" required />
            <button type="submit" class="send-btn" title="Enviar">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
        </div>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
