# Minimal AWS deployment: chatbot + retrieval only.
# Dashboard, MinIO, Celery, ingest_raw, extract_text are NOT included.
# PostgreSQL is replaced by Neon.tech (set DATABASE_URL and DATABASE_URL_SYNC in .env.aws).
#
# Usage:
#   docker compose -f docker-compose.aws.yml up -d --build

services:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata-aws:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  retrieval-admin-service:
    build:
      context: ./services/retrieval_admin
    env_file: .env.aws
    environment:
      API_PORT: "8010"
      REDIS_CACHE_URL: redis://redis:6379/2
      MINIO_ENDPOINT: "unused:9000"    # MinIO is not called during retrieval
      MILVUS_HOST: unused              # MILVUS_URI from .env.aws takes precedence
      API_SSL_CERTFILE: ""             # nginx handles TLS; service runs plain HTTP
      API_SSL_KEYFILE: ""
    depends_on:
      redis:
        condition: service_healthy
    # Port 8010 is intentionally NOT exposed — internal only

  chatbot-response-service:
    build:
      context: ./services/chatbot_response
    env_file: .env.aws
    environment:
      API_PORT: "8020"
      REDIS_CACHE_URL: redis://redis:6379/2
      RETRIEVAL_ADMIN_BASE_URL: http://retrieval-admin-service:8010
      LLM_PROVIDER: deepseek
      API_SSL_CERTFILE: ""             # nginx handles TLS; service runs plain HTTP
      API_SSL_KEYFILE: ""
    depends_on:
      redis:
        condition: service_healthy
      retrieval-admin-service:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/aws.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - chatbot-response-service

volumes:
  redisdata-aws:
