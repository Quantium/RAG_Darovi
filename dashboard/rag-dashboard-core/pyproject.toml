[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: tests requiring Docker services (Milvus, MinIO, Ollama, etc.)",
    "slow: tests taking >5s",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "pymilvus",
    "celery",
    "pytesseract",
    "gspread",
    "yaml",
    "openpyxl",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.worker.tasks",
    "src.worker.celery_app",
    "src.scheduler.pipeline",
    "src.drive.local_downloader",
    "src.vectorizer.milvus_store",
    "src.converter.pdf_converter",
    "src.vision.client",
    "src.vision.circuit_breaker",
    "src.vision.image_utils",
    "src.metadata.repository",
]
disable_error_code = [
    "no-untyped-def",
    "untyped-decorator",
    "misc",
    "arg-type",
    "attr-defined",
    "no-untyped-call",
    "no-any-return",
    "import-untyped",
    "type-arg",
    "union-attr",
    "operator",
    "call-overload",
    "assignment",
]
