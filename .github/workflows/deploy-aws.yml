name: Deploy chatbot to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/RAG_Darovi
            OLD_HEAD=$(git rev-parse HEAD)
            git fetch origin main
            # Hard reset instead of pull: never blocked by untracked/modified files on EC2
            git reset --hard origin/main

            # Run schema migrations only when schema/ files changed in this push
            SCHEMA_CHANGED=$(git diff "$OLD_HEAD" HEAD --name-only | grep -c '^schema/' || true)
            if [ "$SCHEMA_CHANGED" -gt 0 ]; then
              source ~/.profile
              cd schema/rag-schema
              uv pip install -r requirements.txt -q
              DATABASE_URL=$(grep '^DATABASE_URL_SYNC=' ~/RAG_Darovi/.env.aws | cut -d= -f2-) \
                uv run alembic upgrade head
              cd ~/RAG_Darovi
            else
              echo "No schema changes detected — skipping migrations"
            fi

            # Rebuild and restart only the application services (redis keeps running)
            docker compose -f docker-compose.aws.yml up -d --build --no-deps \
              chatbot-response-service retrieval-admin-service nginx
