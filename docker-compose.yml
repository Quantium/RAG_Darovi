# Service hostnames for containers (overrides .env which uses localhost for host dev)
x-app-env: &app-env
  MINIO_ENDPOINT: minio:9000
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag_darovi
  DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/rag_darovi
  REDIS_BROKER_URL: redis://redis:6379/0
  REDIS_RESULT_URL: redis://redis:6379/1
  REDIS_CACHE_URL: redis://redis:6379/2
  MILVUS_HOST: milvus
  OLLAMA_BASE_URL: http://ollama:11434
  LLM_BASE_URL: http://ollama:11434/v1/

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_darovi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://milvus-etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.21
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      retries: 10

  ollama:
    image: ollama/ollama
    env_file: .env
    ports:
      # Host port 11435 avoids conflict when a local Ollama already uses 11434
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./scripts/ollama-docker-entrypoint.sh:/ollama-docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/ollama-docker-entrypoint.sh"]
    healthcheck:
      # Ready only after entrypoint finishes pulling (see scripts/ollama-docker-entrypoint.sh)
      test: ["CMD-SHELL", "test -f /tmp/ollama-models-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 7200s

  app-api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: *app-env
    volumes:
      # Mount generated certs (see scripts/generate-local-certs.sh); optional if API_SSL_* unset
      - ./certs:/etc/rag/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck-api.sh"]
      interval: 10s
      retries: 5

  app-worker:
    build: .
    command: celery -A src.worker.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy

  app-beat:
    build: .
    command: celery -A src.worker.celery_app beat --loglevel=info
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy

  app-qa:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      <<: *app-env
    # No depends_on: run `docker compose --profile qa run --rm app-qa` without full stack (unit tests use mocks)

volumes:
  pgdata:
  miniodata:
  milvusdata:
  ollama_models:
