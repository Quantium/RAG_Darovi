# Service hostnames for containers (overrides .env which uses localhost for host dev)
x-app-env: &app-env
  MINIO_ENDPOINT: minio:9000
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag_darovi
  DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/rag_darovi
  REDIS_BROKER_URL: redis://redis:6379/0
  REDIS_RESULT_URL: redis://redis:6379/1
  REDIS_CACHE_URL: redis://redis:6379/2
  MILVUS_HOST: milvus
  OLLAMA_BASE_URL: http://ollama:11434
  LLM_BASE_URL: http://ollama:11434/v1/
  # VLM lives in a dedicated container so it does not evict embedding/chat
  # models from VRAM. See migration plan section 2.1 for the reasoning.
  VISION_BASE_URL: http://ollama-vision:11434

services:
  redis:
    image: redis:7-alpine
    # AOF persistence so the broker (DB 0) survives docker compose down/up.
    # Without this, queued vision_extract tasks vanish on every restart and
    # files stuck in `vision_pending` need to be requeued by hand.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_darovi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://milvus-etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.21
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      retries: 10

  ollama:
    image: ollama/ollama
    env_file: .env
    environment:
      # Embedding workload is bursty and short-lived; keep models warm but
      # bounded to avoid stomping on the VLM container's VRAM share.
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Pull the embedder + chat model only; the VLM lives in ollama-vision.
      OLLAMA_PULL_MODELS: ${EMBED_MODEL:-nomic-embed-text},${LLM_MODEL:-qwen3.5:9b}
    ports:
      # Host port 11435 avoids conflict when a local Ollama already uses 11434
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./scripts/ollama-docker-entrypoint.sh:/ollama-docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/ollama-docker-entrypoint.sh"]
    healthcheck:
      # Ready only after entrypoint finishes pulling (see scripts/ollama-docker-entrypoint.sh)
      test: ["CMD-SHELL", "test -f /tmp/ollama-models-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 7200s

  ollama-vision:
    # Dedicated Ollama instance for Llama-3.2-Vision. Isolated so a single
    # heavy multi-page request cannot starve embeddings or chat. KEEP_ALIVE
    # is short so the model gets unloaded between bursts and the embedder
    # can claim VRAM without competition.
    image: ollama/ollama
    env_file: .env
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_PULL_MODELS: ${VISION_MODEL:-llama3.2-vision:11b}
    ports:
      - "11436:11434"
    volumes:
      - ollama_vision_models:/root/.ollama
      - ./scripts/ollama-docker-entrypoint.sh:/ollama-docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/ollama-docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ollama-models-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 14400s  # 4h to allow first-time Llama-3.2-Vision pull

  dashboard-api:
    build: ./dashboard/rag-dashboard-core
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: *app-env
      INGEST_RAW_TRIGGER_URL: http://ingest-raw-service:8030
      EXTRACT_TEXT_TRIGGER_URL: http://extract-text-service:8031
      LOCAL_SOURCE_FOLDER: /app/LABORATORIOS
    volumes:
      # Mount generated certs (see scripts/generate-local-certs.sh); optional if API_SSL_* unset
      - ./certs:/etc/rag/certs:ro
      - ./LABORATORIOS:/app/LABORATORIOS:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck-api.sh"]
      interval: 10s
      retries: 5

  dashboard-worker:
    # Handles downstream orchestration (poll -> vision -> embed).
    build: ./dashboard/rag-dashboard-core
    command: celery -A src.worker.celery_app worker --loglevel=info --concurrency=1 -Q celery,default,embed
    env_file: .env
    environment:
      <<: *app-env
      LOCAL_SOURCE_FOLDER: /app/LABORATORIOS
    volumes:
      - ./LABORATORIOS:/app/LABORATORIOS:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy

  ingest-raw-service:
    build:
      context: ./services/ingest_raw
    env_file: .env
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/rag_darovi
      MINIO_ENDPOINT: minio:9000
      INGEST_RAW_CRON: ${INGEST_RAW_CRON:-0 * * * *}
      INGEST_RAW_PAGE_SIZE: ${INGEST_RAW_PAGE_SIZE:-200}
      INGEST_RAW_RUN_ON_START: ${INGEST_RAW_RUN_ON_START:-true}
      LOCAL_SOURCE_FOLDER: /app/LABORATORIOS
    volumes:
      - ./LABORATORIOS:/app/LABORATORIOS:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  extract-text-service:
    build:
      context: ./services/extract_text
    env_file: .env
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/rag_darovi
      MINIO_ENDPOINT: minio:9000
      EXTRACT_TEXT_CRON: ${EXTRACT_TEXT_CRON:-*/10 * * * *}
      EXTRACT_TEXT_BATCH_SIZE: ${EXTRACT_TEXT_BATCH_SIZE:-200}
      EXTRACT_TEXT_RUN_ON_START: ${EXTRACT_TEXT_RUN_ON_START:-true}
      EXTRACT_TEXT_LOCK_ID: ${EXTRACT_TEXT_LOCK_ID:-8245101}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  retrieval-admin-service:
    build:
      context: ./services/retrieval_admin
    env_file: .env
    environment:
      API_PORT: 8010
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag_darovi
      REDIS_CACHE_URL: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MILVUS_HOST: milvus
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_BASE_URL: http://ollama:11434/v1/
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy

  chatbot-response-service:
    build:
      context: ./services/chatbot_response
    env_file: .env
    environment:
      API_PORT: 8020
      REDIS_CACHE_URL: redis://redis:6379/2
      RETRIEVAL_ADMIN_BASE_URL: http://retrieval-admin-service:8010
      LLM_BASE_URL: ${DEEPSEEK_BASE_URL:-http://ollama:11434/v1/}
      LLM_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LLM_PROVIDER: deepseek
    ports:
      - "8020:8020"
    depends_on:
      redis:
        condition: service_healthy
      retrieval-admin-service:
        condition: service_started

  dashboard-worker-vision:
    # Dedicated worker for the VLM stage. concurrency=1 because each VLM
    # call already saturates the GPU; running multiple at once would cause
    # OOM on common 16 GB cards. Scale horizontally by adding replicas.
    build: ./dashboard/rag-dashboard-core
    command: celery -A src.worker.celery_app worker --loglevel=info --concurrency=1 -Q vision
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-vision:
        condition: service_healthy

  dashboard-beat:
    build: ./dashboard/rag-dashboard-core
    command: celery -A src.worker.celery_app beat --loglevel=info
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy

  dashboard-qa:
    profiles: ["qa"]
    build:
      context: ./dashboard/rag-dashboard-core
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      <<: *app-env
    # No depends_on: run `docker compose --profile qa run --rm dashboard-qa` without full stack (unit tests use mocks)

volumes:
  pgdata:
  miniodata:
  milvusdata:
  ollama_models:
  ollama_vision_models:
  redisdata:
